security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        app_users:
            entity:
                class: App\Entity\User

    firewalls:
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_concert_index
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
                invalidate_session: true

    access_control:
        - { path: '^/invitation/[a-f0-9]{64}$', roles: PUBLIC_ACCESS }
        - { path: '^/salle(?:/|$)', roles: PUBLIC_ACCESS }
        - { path: ^/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
